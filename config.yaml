# daily runs (Israel time) - only if the scheduler is on: docker compose --profile schedule up -d
schedule:
  scan: "17:00"     # search + filter + Claude score -> new cards on the board
  digest: "18:00"   # email/Telegram digest - only if SMTP/Telegram is set in .env

location: Israel
geo_id: "101620260"        # LinkedIn geoId for Israel
location_exclude:          # drop jobs whose LinkedIn location contains one of these
  - Jerusalem              # also matches "Jerusalem District" (Beit Shemesh, Mevaseret Zion...)
  - ירושלים
posted_within_hours: 48     # only jobs from the last 1-2 days
max_years_required: 4       # drop jobs whose MINIMUM is above this: 4+ / 3-6 ok, 5+ dropped
pages_per_query: 8          # result pages per search keyword; LinkedIn gives 10 jobs/page -> up to 80
easy_apply_only: false      # true = only Easy Apply jobs; false = also company sites (apply.py fills, you click Submit)
exclude_senior_titles: false  # true = also drop titles with senior_title_words (years filter still applies)

# Claude match score (0-100) vs your CV
score_model: claude-sonnet-5-5   # claude-opus-5-5 = stronger, about 2x the price
apply_threshold: 70         # >= this -> apply queue
review_threshold: 50        # 50-69 -> saved for review, not applied
max_applications_per_day: 20
follow_companies: false     # false = untick LinkedIn's "Follow <company>" box before every Submit
keep_logs_days: 1           # auto clean at every apply/scan run: delete logs/ from earlier days (1 = keep today's, 0 = off)

# category -> search keywords
queries:
  Backend:
    - Backend Developer
    - Backend Engineer
    - Python Developer
    - Node.js Developer
    - Server Side Developer
  Full Stack:
    - Full Stack Developer
    - Fullstack Engineer
  AI Engineer:
    - AI Engineer
    - LLM Engineer
    - GenAI Engineer
    - Machine Learning Engineer
  Data Science:
    - Data Scientist
    - Junior Data Scientist
  DevOps:
    - DevOps Engineer
    - Junior DevOps
    - Cloud Engineer
    - Platform Engineer
    - SRE

# dropped only when exclude_senior_titles is true
senior_title_words:
  - senior
  - "sr."
  - "sr "
  - lead
  - staff
  - principal
  - architect
  - ראש צוות
  - בכיר

# always dropped (management or non-relevant roles)
title_exclude:
  - head of
  - manager
  - director
  - "vp "
  - qa
  - frontend
  - front-end
  - android
  - ios
  - test
  - automation
  - noc
  - support
  - validation
  - verification
  - security analyst
  - " soc "
  - penetration
  - solution
  - " sales "
  - hardware
  - embedded
  - firmware
  - fpga
  - asic
  - robotics
  - simulation
  - mechanical
  - electrical
  - student
  - " intern "
  - internship

company_blacklist:
  - Mobileye

# title must contain at least one of these (search returns noise)
title_include:
  - backend
  - back-end
  - back end
  - server
  - full stack
  - fullstack
  - full-stack
  - python
  - node
  - software engineer
  - software developer
  - sw engineer
  - java
  - ".net"
  - golang
  - " go "
  - "ai "
  - "ai/"
  - llm
  - ai-
  - "(ai)"
  - artificial intelligence
  - deep learning
  - ml engineer
  - genai
  - machine learning
  - "ml "
  - data scien
  - devops
  - dev ops
  - cloud
  - platform
  - " sre"
  - site reliability
  - infrastructure
  - מפתח
  - מפתחת
  - תוכניתן
